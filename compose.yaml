
services:
  backend:
    image: mdhoucem/backend-ecommerce:1.0

    ports:
      - "5126:8080"

    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__DefaultConnection: ${DB_CONNECTION}

    volumes:
      - .:/app
      - nuget_packages:/root/.nuget/packages

volumes:
  nuget_packages:
